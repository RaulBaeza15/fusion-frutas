name: decode-preview
on: push
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and clean up
        run: |
          base64 -d preview.b64 > preview.png
          rm preview.b64 .github/workflows/preview.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add preview.png social image"
          git push
