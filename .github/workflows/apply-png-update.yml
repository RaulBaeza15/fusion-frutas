name: Apply PNG and collision update
on:
  push:
    paths:
      - assets-bundle.b64
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Decode asset bundle
        run: |
          base64 -d assets-bundle.b64 > /tmp/fusion-png-update.zip
          unzip -o /tmp/fusion-png-update.zip -d .
          git config user.name 'R15 Studios asset update'
          git config user.email 'actions@users.noreply.github.com'
          git add README.md css/style.css index.html js/app.js js/custom.js js/engine.js js/silhouette.js js/vendor/decomp.min.js js/themes/frutas.js assets/frutas
          if ! git diff --cached --quiet; then
            git commit -m 'Use local transparent PNGs and alpha-derived hitboxes'
            git push origin HEAD:main
          fi
