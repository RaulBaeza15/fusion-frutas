<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esta fruta se ha escapado - Fusión Frutal</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8D%89%3C/text%3E%3C/svg%3E">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #05060a;
      color: #e8f6ff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    .card { max-width: 420px; display: flex; flex-direction: column; gap: 18px; align-items: center; }
    .fruit { font-size: 4.5rem; filter: drop-shadow(0 0 20px rgba(255, 46, 99, 0.8)); }
    h1 {
      font-size: 1.5rem;
      color: #ff2e63;
      text-shadow: 0 0 16px rgba(255, 46, 99, 0.9);
    }
    p { color: rgba(232, 246, 255, 0.7); line-height: 1.5; }
    a.btn {
      display: inline-block;
      color: #00f5ff;
      border: 1px solid #00f5ff;
      border-radius: 10px;
      padding: 12px 24px;
      text-decoration: none;
      font-weight: 700;
      text-shadow: 0 0 8px rgba(0, 245, 255, 0.7);
      box-shadow: 0 0 14px rgba(0, 245, 255, 0.3);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="fruit">🫐</div>
    <h1>Esta fruta se ha escapado del cesto</h1>
    <p>La página que buscas no existe o se ha fusionado con otra. Vuelve al juego y sigue sumando puntos.</p>
    <a class="btn" href="./">Volver a Fusión Frutal</a>
  </div>
</body>
</html>
